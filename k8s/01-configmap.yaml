apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag-system
  labels:
    app.kubernetes.io/name: rag-config
    app.kubernetes.io/part-of: production-level-rag
data:
  # --- Vector & Graph Database Endpoints ---
  QDRANT_URL: "http://qdrant:6333"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"

  # --- Neo4j Memory & Configuration ---
  NEO4J_PLUGINS: '["apoc"]'
  NEO4J_server_memory_heap_initial__size: "512m"
  NEO4J_server_memory_heap_max__size: "1024m"
  NEO4J_server_memory_pagecache_size: "512m"

  # --- LLM Provider & Routing ---
  LLM_PROVIDER: "groq"
  GROQ_MODEL: "openai/gpt-oss-120b"
  GEMINI_MODEL: "gemini-2.5-flash"
  NVIDIA_MODEL: "google/gemma-4-31b-it"

  # --- Local Model Configurations ---
  LOCAL_LLM_DEVICE: "cpu"
  LOCAL_LLM_MAX_NEW_TOKENS: "1024"
  LOCAL_LLM_MODEL_PATH: "/models/llm/Qwen2.5-1.5B-Instruct"

  # --- Reranker Configuration ---
  RERANKER_ENABLED: "true"
  RERANKER_MODEL_NAME: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  RERANKER_MAX_LENGTH: "256"
  RERANKER_DEVICE: "auto"
  RERANKER_USE_FP16: "true"
  RERANKER_LOCAL_FILES_ONLY: "false"

  # --- OpenTelemetry & Observability ---
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "financial-rag-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

  # --- Langfuse LLM Observability ---
  LANGFUSE_HOST: "https://us.cloud.langfuse.com"
  LANGFUSE_BASE_URL: "https://us.cloud.langfuse.com"
  LANGFUSE_TRACING_ENVIRONMENT: "production"
