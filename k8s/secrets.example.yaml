# ==============================================================================
# Kubernetes Secret Configuration Template
# ==============================================================================
# DO NOT commit real API keys or sensitive production passwords to version control.
#
# Method 1 (Recommended): Create directly from your local .env file
# ------------------------------------------------------------------
#   kubectl create secret generic rag-secrets \
#     --namespace=rag-system \
#     --from-literal=NEO4J_PASSWORD="production_password" \
#     --from-literal=GROQ_API_KEY="gsk_..." \
#     --from-literal=GEMINI_API_KEY="AIza..." \
#     --from-literal=NVIDIA_API_KEY="nvapi-..." \
#     --from-literal=LANGFUSE_PUBLIC_KEY="pk-lf-..." \
#     --from-literal=LANGFUSE_SECRET_KEY="sk-lf-..." \
#     --from-literal=HF_TOKEN="hf_..."
#
# Method 2: Apply via Manifest (Copy to 02-secrets.yaml and fill in your values)
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag-system
  labels:
    app.kubernetes.io/name: rag-secrets
    app.kubernetes.io/part-of: production-level-rag
type: Opaque
stringData:
  # Neo4j Graph Database Credentials
  NEO4J_PASSWORD: "production_password"

  # Cloud LLM API Keys
  GROQ_API_KEY: "your_groq_api_key_here"
  GEMINI_API_KEY: "your_gemini_api_key_here"
  NVIDIA_API_KEY: "your_nvidia_api_key_here"
  HF_TOKEN: "your_huggingface_token_here"

  # Langfuse Observability Keys
  LANGFUSE_PUBLIC_KEY: "pk-lf-..."
  LANGFUSE_SECRET_KEY: "sk-lf-..."
