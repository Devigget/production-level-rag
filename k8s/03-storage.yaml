apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-pvc
  namespace: rag-system
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: production-level-rag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: rag-system
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: production-level-rag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data-pvc
  namespace: rag-system
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: production-level-rag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
