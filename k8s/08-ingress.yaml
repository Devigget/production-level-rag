apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  namespace: rag-system
  labels:
    app.kubernetes.io/name: rag-ingress
    app.kubernetes.io/part-of: production-level-rag
  annotations:
    kubernetes.io/ingress.class: nginx
    # Support up to 50MB file uploads for financial documents (PDFs, Excel, Word)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Disable buffering to enable real-time Server-Sent Events (SSE) token streaming
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Extend timeouts for long-running LLM and RAG generation requests
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: rag.local
      http:
        paths:
          # Route API endpoints to FastAPI Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Route Health Probes to FastAPI Backend
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Route Prometheus Metrics to FastAPI Backend
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Route root and static UI assets to React/Nginx Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    # Fallback rule for IP access without custom Host header
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
